name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Build content.js from content/*.json and fail if it is out of sync
      # with the committed file.
      - run: node tools/build-content.mjs
      - run: git diff --exit-code content.js || (echo "content.js is stale — run 'npm run build' and commit"; exit 1)
      # Fast, browserless content validation.
      - run: node tests/validate-content.mjs
      # Then the Playwright integration tests.
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/integration.test.mjs
