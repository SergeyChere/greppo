name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fast, browserless content validation first.
      - run: node tests/validate-content.mjs
      # Then the Playwright integration tests.
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/integration.test.mjs
